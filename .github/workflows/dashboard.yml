name: Test suite + dashboard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Run tests & build dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Automation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Automation/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run test suite
        env:
          BASE_URL: ${{ secrets.CONSENTZ_BASE_URL || 'https://v3.consentz.com' }}
          CONSENTZ_USERNAME: ${{ secrets.CONSENTZ_USERNAME }}
          CONSENTZ_PASSWORD: ${{ secrets.CONSENTZ_PASSWORD }}
          HEADLESS: "1"
        run: npx playwright test --project=chromium --reporter=list,json,html
        continue-on-error: true   # Build dashboard even on test failure — that's the whole point

      - name: Build dashboard data
        working-directory: .
        run: node tools/build-dashboard-data.js

      - name: Upload Playwright HTML report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Automation/playwright-report/
          retention-days: 14

      - name: Upload dashboard
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/

  deploy-pages:
    name: Publish dashboard to GitHub Pages
    needs: test-and-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
