name: Test suite + dashboard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_full_suite:
        description: 'Include calendar / patients / dashboard tests (default: on — untick to run only the fast subset)'
        type: boolean
        default: true
  schedule:
    # Run every 12 hours (00:00 and 12:00 UTC) so the dashboard reflects
    # the current state of staging without needing a manual push.
    - cron: '0 */12 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Run tests & build dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Automation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Automation/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Fetch previous dashboard run + trend (for cross-run history)
        # GitHub Pages serves the prior deployment's data files. We pull
        # both results.json (used for the previous-run snapshot in the
        # payload) and trend.json (so the time-series persists across
        # otherwise-fresh CI checkouts — dashboard/data/ is gitignored,
        # which means archive history dies between runs without this).
        # First-ever run on a fresh Pages site will 404 on both — that's
        # fine, the build script tolerates missing inputs.
        continue-on-error: true
        run: |
          REPO_OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          BASE="https://${REPO_OWNER}.github.io/${REPO_NAME}"
          echo "Fetching ${BASE}/data/results.json"
          curl -fsSL "${BASE}/data/results.json" -o .previous-results.json && \
            echo "  got previous-results ($(wc -c < .previous-results.json) bytes)" || \
            echo "  no previous-results — first run or 404"
          echo "Fetching ${BASE}/data/trend.json"
          curl -fsSL "${BASE}/data/trend.json" -o .previous-trend.json && \
            echo "  got previous-trend ($(wc -c < .previous-trend.json) bytes)" || \
            echo "  no previous-trend — first run or 404"

      - name: Run test suite
        env:
          BASE_URL: ${{ secrets.CONSENTZ_BASE_URL || 'https://v3.consentz.com' }}
          CONSENTZ_USERNAME: ${{ secrets.CONSENTZ_USERNAME }}
          CONSENTZ_PASSWORD: ${{ secrets.CONSENTZ_PASSWORD }}
          HEADLESS: "1"
          # Heavy-suite toggle. Now defaulting to 'true' — push/PR/cron
          # runs include tests/{calendar,patients,dashboard}/. The "Run
          # workflow" UI still exposes the checkbox so individual runs can
          # opt out (untick to use the fast subset). To make ALL runs fast
          # again permanently, flip this fallback from 'true' to 'false'.
          RUN_FULL_SUITE: ${{ github.event.inputs.run_full_suite || 'true' }}
        run: npx playwright test --project=chromium
        continue-on-error: true   # Build dashboard even on test failure — that's the whole point

      - name: Build dashboard data (incl. Sentry enrichment)
        working-directory: .
        env:
          # Optional — when set, build-dashboard-data.js dispatches each
          # Unknown failure + tripwire-fired event to our Sentry project and
          # attaches the issue URL to the dashboard payload. Without it, the
          # sender runs in stub mode (still attaches placeholder URLs so the
          # dashboard can render the "Sentry pending" badge).
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ORG_SLUG: ${{ secrets.SENTRY_ORG_SLUG || 'piyush-singhal' }}
          SENTRY_PROJECT_ID: ${{ secrets.SENTRY_PROJECT_ID || '4511393188085760' }}
          GIT_SHA: ${{ github.sha }}
          GIT_BRANCH: ${{ github.ref_name }}
        run: node tools/build-dashboard-data.js

      - name: Upload Playwright HTML report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Automation/playwright-report/
          retention-days: 14

      - name: Upload dashboard
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/

  deploy-pages:
    name: Publish dashboard to GitHub Pages
    needs: test-and-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
