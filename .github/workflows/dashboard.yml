name: Test suite + dashboard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Run tests & build dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Automation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Automation/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Fetch previous dashboard run (for trend deltas)
        # GitHub Pages serves dashboard/data/results.json from the prior
        # deployment. Save it locally so build-dashboard-data.js can include
        # last run's pass/fail + bug counts in the new payload. First-ever
        # run on a fresh Pages site will 404 — that's fine, the build script
        # tolerates a missing snapshot.
        continue-on-error: true
        run: |
          REPO_OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          PREV_URL="https://${REPO_OWNER}.github.io/${REPO_NAME}/data/results.json"
          echo "Fetching ${PREV_URL}"
          curl -fsSL "${PREV_URL}" -o .previous-results.json && \
            echo "Got previous snapshot ($(wc -c < .previous-results.json) bytes)" || \
            echo "No previous snapshot — first run or 404"

      - name: Run test suite
        env:
          BASE_URL: ${{ secrets.CONSENTZ_BASE_URL || 'https://v3.consentz.com' }}
          CONSENTZ_USERNAME: ${{ secrets.CONSENTZ_USERNAME }}
          CONSENTZ_PASSWORD: ${{ secrets.CONSENTZ_PASSWORD }}
          HEADLESS: "1"
        run: npx playwright test --project=chromium
        continue-on-error: true   # Build dashboard even on test failure — that's the whole point

      - name: Build dashboard data
        working-directory: .
        run: node tools/build-dashboard-data.js

      - name: Upload Playwright HTML report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Automation/playwright-report/
          retention-days: 14

      - name: Upload dashboard
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/

  deploy-pages:
    name: Publish dashboard to GitHub Pages
    needs: test-and-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
